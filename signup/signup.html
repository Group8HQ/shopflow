<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopFlow – Create Account</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
 
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
 
  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 1.5rem;
  }
 
  .brand-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
 
  .brand-icon {
    width: 36px;
    height: 36px;
    background: #e8410a;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
 
  .brand-icon svg {
    width: 20px;
    height: 20px;
    fill: #fff;
  }
 
  .brand-name {
    font-size: 1.4rem;
    font-weight: 700;
    color: #1a1a1a;
  }
 
  .brand-sub {
    font-size: 0.85rem;
    color: #6b7280;
    margin-top: 2px;
  }
 
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 2rem 2rem;
    width: 100%;
    max-width: 480px;
    border: 1px solid #e5e7eb;
  }
 
  .card h1 {
    font-size: 1.65rem;
    font-weight: 700;
    color: #111827;
    margin-bottom: 0.4rem;
  }
 
  .card .subtitle {
    font-size: 0.92rem;
    color: #6b7280;
    margin-bottom: 1.6rem;
    line-height: 1.5;
  }
 
  .form-group {
    margin-bottom: 1.1rem;
  }
 
  label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    color: #374151;
    margin-bottom: 6px;
  }
 
  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }
 
  .input-icon {
    position: absolute;
    left: 13px;
    color: #9ca3af;
    display: flex;
    align-items: center;
  }
 
  .input-icon svg {
    width: 18px;
    height: 18px;
    stroke: #9ca3af;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
 
  input[type="text"],
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 11px 13px 11px 40px;
    border: 1.5px solid #d1d5db;
    border-radius: 8px;
    font-size: 0.9rem;
    color: #111827;
    background: #fff;
    outline: none;
    transition: border-color 0.2s;
  }
 
  input::placeholder { color: #9ca3af; }
 
  input:focus {
    border-color: #e8410a;
    box-shadow: 0 0 0 3px rgba(232,65,10,0.1);
  }
 
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
 
  .terms {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin: 1.2rem 0 1.4rem;
    font-size: 0.875rem;
    color: #4b5563;
    line-height: 1.5;
  }
 
  .terms input[type="checkbox"] {
    width: 16px;
    height: 16px;
    min-width: 16px;
    margin-top: 2px;
    accent-color: #e8410a;
    cursor: pointer;
    padding: 0;
    border: none;
    box-shadow: none;
  }
 
  .terms a {
    color: #e8410a;
    text-decoration: none;
    font-weight: 500;
  }
 
  .terms a:hover { text-decoration: underline; }
 
  .btn-submit {
    width: 100%;
    padding: 13px;
    background: #e8410a;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.2s;
  }
 
  .btn-submit:hover { background: #c93509; }
 
  .btn-submit svg {
    width: 18px;
    height: 18px;
    stroke: #fff;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
 
  .divider {
    border: none;
    border-top: 1px solid #e5e7eb;
    margin: 1.4rem 0 1.2rem;
  }
 
  .login-prompt {
    text-align: center;
    font-size: 0.875rem;
    color: #6b7280;
  }
 
  .login-prompt a {
    color: #e8410a;
    font-weight: 600;
    text-decoration: none;
  }
 
  .login-prompt a:hover { text-decoration: underline; }
</style>
</head>
<body>
 
<div class="brand">
  <div class="brand-logo">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 3h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V4a1 1 0 011-1z"/>
        <path d="M4 9h16l-1.5 9.5a1 1 0 01-.99.5H6.49a1 1 0 01-.99-.5L4 9z"/>
      </svg>
    </div>
    <span class="brand-name">ShopFlow</span>
  </div>
  <span class="brand-sub">Admin Console Management</span>
</div>
 
<div class="card">
  <h1>Create Account</h1>
  <p class="subtitle">Enter your details to get started with your management system.</p>
 
  <form method="POST" action="signup.php">
 
    <div class="form-group">
      <label for="full_name">Full Name</label>
      <div class="input-wrapper">
        <span class="input-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        </span>
        <input type="text" id="full_name" name="full_name" placeholder="Muganwa " required>
      </div>
    </div>
 
    <div class="form-group">
      <label for="email">Email Address</label>
      <div class="input-wrapper">
        <span class="input-icon">
          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
        </span>
        <input type="email" id="email" name="email" placeholder="name@company.com" required>
      </div>
    </div>
 
    <div class="row">
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
          </span>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
      </div>
 
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/><circle cx="12" cy="16" r="1" fill="#9ca3af"/></svg>
          </span>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
        </div>
      </div>
    </div>
 
    <div class="terms">
      <input type="checkbox" id="agree" name="agree" required>
      <label for="agree" style="font-weight:400; margin:0;">
        By creating an account, I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
      </label>
    </div>
 
    <button type="submit" class="btn-submit">
      Create Account
      <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
 
  </form>
 
  <hr class="divider">
 
  <p class="login-prompt">
    Already have an account? <a href="../login/login.html">Log into ShopFlow ↩</a>
  </p>
</div>

<div id="toast" style="
  display: none;
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: #c59122;
  color: #fff;
  padding: 14px 24px;
  border-radius: 10px;
  font-size: 0.95rem;
  font-weight: 500;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  z-index: 9999;
  text-align: center;
"></div>

<script>
  // Read the ?msg= from the URL and show it as a popup
  const params = new URLSearchParams(window.location.search);
  const msg = params.get('msg');

  if (msg) {
    const toast = document.getElementById('toast');
    toast.textContent = decodeURIComponent(msg);
    toast.style.display = 'block';

    // Hide it after 4 seconds
    setTimeout(() => {
      toast.style.display = 'none';
    }, 4000);

    // Clean the URL so the message doesn't show again on refresh
    window.history.replaceState({}, document.title, window.location.pathname);
  }
</script>
 
</body>
</html>
