<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopFlow - Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-container">
        <header class="brand-header">
            <div class="logo">
                <i class="fa-solid fa-table-cells-large"></i>
                <span>ShopFlow</span>
            </div>
            <p class="tagline">Manage your retail shop, track sales, and check stock.</p>
        </header>

        <section class="login-card">
            <h2>Welcome Back</h2>
            <p class="instruction">Please enter your credentials to access the system.</p>

            <form>
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="admin@shopflow.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                        <i class="fa-regular fa-eye toggle-password"></i>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    Sign In <i class="fa-solid fa-right-to-bracket"></i>
                </button>
            </form>

            <div class="divider"></div>

            <p class="signup-prompt">
                Don't have an account yet? <a href="signup.html">Create Profile</a>
            </p>
        </section>
    </main>

</body>
</html>
