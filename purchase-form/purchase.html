<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Purchase Entry</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f0f0f0; color: #222; }

  .breadcrumb { font-size: 12px; padding: 14px 32px; color: #888; letter-spacing: .5px; }
  .breadcrumb span { color: #e05a2b; font-weight: 600; }

  .container { max-width: 720px; margin: 0 auto; padding: 0 24px 40px; }
  h1 { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #777; margin-bottom: 24px; }

  .card { background: #fff; border-radius: 10px; padding: 28px 28px 24px; box-shadow: 0 1px 6px rgba(0,0,0,.08); }

  .row { display: flex; gap: 20px; margin-bottom: 20px; }
  .field { display: flex; flex-direction: column; flex: 1; }
  .field.full { flex: 1 1 100%; }

  label { font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: #555; margin-bottom: 6px; }

  input[type="text"], input[type="date"], input[type="number"] {
    border: 1.5px solid #ddd; border-radius: 6px; padding: 10px 14px;
    font-size: 14px; color: #333; outline: none; transition: border .2s;
    background: #fafafa; width: 100%;
  }
  input:focus { border-color: #e05a2b; background: #fff; }

  .unit-wrapper { display: flex; border: 1.5px solid #ddd; border-radius: 6px; overflow: hidden; transition: border .2s; }
  .unit-wrapper:focus-within { border-color: #e05a2b; }
  .unit-prefix { background: #f0f0f0; padding: 10px 12px; font-size: 13px; font-weight: 600; color: #666; border-right: 1.5px solid #ddd; }
  .unit-wrapper input { border: none; border-radius: 0; background: #fafafa; }
  .unit-wrapper input:focus { background: #fff; }

  .total-box { background: #fafafa; border: 1.5px solid #eee; border-radius: 8px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
  .total-label p { font-size: 13px; font-weight: 700; color: #333; }
  .total-label small { font-size: 11px; color: #999; }
  .total-value { font-size: 22px; font-weight: 800; color: #e05a2b; }

  .actions { display: flex; justify-content: flex-end; align-items: center; gap: 16px; margin-top: 24px; }
  .btn-discard { background: none; border: none; font-size: 13px; font-weight: 700; letter-spacing: .5px; color: #888; cursor: pointer; text-transform: uppercase; }
  .btn-discard:hover { color: #333; }
  .btn-submit { background: #e05a2b; color: #fff; border: none; border-radius: 6px; padding: 12px 22px; font-size: 13px; font-weight: 700; letter-spacing: .5px; cursor: pointer; display: flex; align-items: center; gap: 8px; text-transform: uppercase; transition: background .2s; }
  .btn-submit:hover { background: #c74d23; }
  .btn-submit svg { width: 16px; height: 16px; }

  #msg { margin-bottom: 16px; padding: 10px 14px; border-radius: 6px; font-size: 13px; display: none; }
  .success { background: #e6f9ed; color: #1a7a3c; border: 1px solid #a3d9b5; }
  .error { background: #fdecea; color: #b71c1c; border: 1px solid #f5a0a0; }
</style>
</head>
<body>

<div class="breadcrumb">DASHBOARD / <span>NEW PURCHASE ENTRY</span></div>

<div class="container">
  <h1>New Purchase Entry</h1>
  <p class="subtitle">All fields are required — data posts to the purchases table.</p>

  <div class="card">
   <div id="msg"></div>
    <form id="purchaseForm" action="save.php" method="POST">

      <div class="row">
        <div class="field">
          <label>Purchase ID</label>
          <input type="text" name="purchase_id" id="purchase_id" placeholder="P001" required>
        </div>
        <div class="field">
          <label>Date</label>
          <input type="date" name="date" id="date" required>
        </div>
      </div>

      <div class="row">
        <div class="field full">
          <label>Item ID</label>
          <input type="text" name="item_id" id="item_id" placeholder="ITEM-001" required>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Quantity</label>
          <input type="number" name="quantity" id="quantity" placeholder="0" min="1" required>
        </div>
        <div class="field">
          <label>Unit Cost (UGX)</label>
          <div class="unit-wrapper">
            <span class="unit-prefix">UGX</span>
            <input type="number" name="unit_cost" id="unit_cost" placeholder="0" min="0" step="100" required>
          </div>
        </div>
      </div>

      <div class="total-box">
        <div class="total-label">
          <p>Total Transaction Value</p>
          <small>Calculated based on quantity × unit cost.</small>
        </div>
        <div class="total-value" id="total_display">UGX 0</div>
        <input type="hidden" name="total_cost" id="total_cost" value="0">
      </div>

      <div class="actions">
        <button type="button" class="btn-discard" onclick="resetForm()">DISCARD</button>
        <button type="submit" class="btn-submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          SAVE PURCHASE
        </button>
      </div>

    </form>
  </div>
</div>

<script>
  // Auto-fill today's date
  document.getElementById('date').valueAsDate = new Date();


  // Calculate total
  function calcTotal() {
    const qty = parseFloat(document.getElementById('quantity').value) || 0;
    const cost = parseFloat(document.getElementById('unit_cost').value) || 0;
    const total = qty * cost;
    document.getElementById('total_display').textContent = 'UGX ' + total.toLocaleString('en-UG', {minimumFractionDigits:2, maximumFractionDigits:2});
    document.getElementById('total_cost').value = total.toFixed(2);
  }
  document.getElementById('quantity').addEventListener('input', calcTotal);
  document.getElementById('unit_cost').addEventListener('input', calcTotal);

  // AJAX submit
  document.getElementById('purchaseForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const msg = document.getElementById('msg');
    msg.style.display = 'none';
    try {
      const res = await fetch('save.php', { method: 'POST', body: new FormData(this) });
      const json = await res.json();
      msg.className = json.success ? 'success' : 'error';
      msg.textContent = json.message;
      msg.style.display = 'block';
      if (json.success) resetForm();
    } catch(e) {
      msg.className = 'error';
      msg.textContent = 'Network error. Please try again.';
      msg.style.display = 'block';
    }
  }
);

  function resetForm() {
    document.getElementById('purchaseForm').reset();
    document.getElementById('date').valueAsDate = new Date();
    document.getElementById('total_display').textContent = 'UGX 0';
    document.getElementById('total_cost').value = '0';
    document.getElementById('msg').style.display = 'none';
  }
</script>
</body>
</html>
